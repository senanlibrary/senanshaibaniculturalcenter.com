name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build and validate site
        working-directory: site
        # GitHub project Pages serves from /<repository>/, so the site is
        # built for that subpath. Both variables exist only for this build:
        # everywhere else the site defaults to the root of its domain.
        #
        # WHEN THE CUSTOM DOMAIN IS ATTACHED, DELETE THIS `env:` BLOCK.
        # A custom domain serves from the root, and leaving these set would
        # prefix every link with the repository name.
        env:
          BASE_PATH: /senanshaibaniculturalcenter.com/
          SITE_URL: https://senanlibrary.github.io
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
